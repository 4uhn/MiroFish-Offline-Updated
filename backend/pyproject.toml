[project]
name = "mirofish-offline-backend"
version = "0.2.0"
description = "Backend for MiroFish Offline+, an on-device multi-agent social simulation (Ollama, Neo4j, OASIS)"
requires-python = ">=3.11,<3.12"
license = { text = "AGPL-3.0" }

dependencies = [
    "flask>=3.1.0",
    "flask-cors>=6.0.0",
    "openai>=1.109.0",
    "requests>=2.32.0",
    "neo4j>=5.23.0",
    "camel-oasis==0.2.5",
    "camel-ai==0.2.78",
    "PyMuPDF>=1.27.0",
    "charset-normalizer>=3.4.0",
    "chardet>=7.0.0",
    "python-dotenv>=1.2.0",
]

[dependency-groups]
dev = [
    "pytest>=9.0.3",
    "pytest-asyncio>=0.23.6",
]

[tool.uv]
package = false
required-version = ">=0.9.8"
override-dependencies = [
    "pillow>=12.3.0",
    "sentence-transformers>=5.6.0,<6",
    "pytest>=9.0.3",
    "pytest-asyncio>=0.23.6",
]
constraint-dependencies = [
    # mcp 2 removed mcp.server.FastMCP, which camel imports at startup
    "mcp>=1.28.1,<2",
    # transformers 5 drops twhin-bert's relative position weights (SECURITY.md)
    "transformers<5",
]
exclude-dependencies = [
    "unstructured",
    "pre-commit",
]
